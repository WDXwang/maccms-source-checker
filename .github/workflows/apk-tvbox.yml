name: Build 星辰TV APK (NewTV2 base)

on:
  workflow_dispatch: # 支持手动触发
  push:
    branches: [main]
    paths:
      - 'tvbox/**'
      - '.github/workflows/apk-tvbox.yml'

permissions:
  contents: write

env:
  # NewTV2：FongMi/TV 5.8.7 的社区定制分支，自带与源码配套的私有 media3 AAR（官方从未公开），
  # 已验证可编译；本流程在其基础上回移上游直播功能并注入内置配置。
  NEWTV2_REPO: 'ctowl2018/NewTV2'
  NEWTV2_SHA: '65ab925802af3e4e5de29d8d6a2f2bdfa91591fa'
  # 上游 FongMi/TV 5.8.7 固定提交：直播功能源文件（Live* 闭包）取自此版本
  UPSTREAM_REPO: 'FongMi/TV'
  UPSTREAM_SHA: '8626650ebcbc0d028e16d859e826fcf439720f3a'
  # 内置配置地址（国内加速代理前缀 + 本仓库每日检测产物：点播 sites + 直播 lives 同源）
  CONFIG_URL: 'https://ghfast.top/https://raw.githubusercontent.com/WDXwang/maccms-source-checker/main/output/tvbox.json'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.10 (ChaquoPy)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - name: Download NewTV2 source (with bundled AARs)
        run: |
          curl -fsSL --retry 3 "https://codeload.github.com/${NEWTV2_REPO}/zip/${NEWTV2_SHA}" -o newtv2.zip
          unzip -q newtv2.zip -d newtv2-src
          nt="$(find newtv2-src -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "NEWTV2_DIR=$nt" >> "$GITHUB_ENV"
          ls "$nt/app/libs" | wc -l

      - name: Download upstream FongMi/TV 5.8.7 (live feature source)
        run: |
          curl -fsSL --retry 3 "https://codeload.github.com/${UPSTREAM_REPO}/zip/${UPSTREAM_SHA}" -o fongmi.zip
          unzip -q fongmi.zip -d fongmi-src
          up="$(find fongmi-src -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "UPSTREAM_DIR=$up" >> "$GITHUB_ENV"

      - name: Apply 星辰TV patches (live backport + builtin config + signing)
        run: |
          node tvbox/patch-newtv2.mjs \
            --src "$NEWTV2_DIR" \
            --up "$UPSTREAM_DIR" \
            --keystore tvbox/keystore/tvbox.p12 \
            --config-url "$CONFIG_URL"

      - name: Build mobile (phone) release
        run: |
          cd "$NEWTV2_DIR"
          chmod +x gradlew
          ver_name="1.0.xctv.$(date -u +%Y%m%d)"
          ver_code=$(( $(date -u +%s) - 1700000000 ))
          echo "VERSION_NAME=$ver_name" >> "$GITHUB_ENV"
          # 本任务构建手机版（新增全屏按钮 + 直播倍速按钮）
          ./gradlew :app:assembleMobileRelease \
            -PappVersionName="$ver_name" \
            -PappVersionCode="$ver_code" \
            --no-configuration-cache --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p tvbox-dist
          find "$NEWTV2_DIR/app/build/outputs/apk" -name '*.apk' -path '*release*' | while read -r f; do
            base="$(basename "$f")"
            case "$f" in
              *mobile*) flavor="mobile" ;;
              *leanback*) flavor="tv" ;;
              *) flavor="unknown" ;;
            esac
            case "$base" in
              *arm64*) abi="arm64" ;;
              *v7a*) abi="v7a" ;;
              *) abi="universal" ;;
            esac
            cp "$f" "tvbox-dist/XCTV-${flavor}-${abi}.apk"
          done
          ls -la tvbox-dist
          [ "$(ls tvbox-dist/*.apk 2>/dev/null | wc -l)" -ge 1 ] || { echo "APK 数量异常"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-apk
          path: tvbox-dist/*
          if-no-files-found: error

      - name: Create GitHub Release with APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="xctv-$(date -u +%Y%m%d-%H%M)"
          notes="星辰TV 自动构建
          - 基线：NewTV2（FongMi/TV 5.8.7 配套源码 + 私有 media3 AAR）+ 上游直播功能回移
          - 内置配置：${CONFIG_URL}
          - 版本：$VERSION_NAME"
          gh release create "$tag" tvbox-dist/*.apk \
            --title "星辰TV $tag" \
            --notes "$notes" \
            --repo "$GITHUB_REPOSITORY" || { echo "release 创建失败（可能同名 tag 已存在），继续"; }
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true
