name: Build TVBox APK

on:
  workflow_dispatch: # 鏀寔鎵嬪姩瑙﹀彂
  push:
    branches: [main]
    paths:
      - 'tvbox/**'
      - '.github/workflows/apk-tvbox.yml'

permissions:
  contents: write

env:
  # 涓婃父 FongMi/TV锛堝奖瑙員V锛夊浐瀹氱増鏈細5.8.7锛堜笌 AAR 濂椾欢 API 鍏煎鐨勭ǔ瀹氬熀绾匡級
  UPSTREAM_SHA: '60e901aa0aeaaac41c3586b7f6c5989db5e4d5a4'
  # NewTV2锛團ongMi/TV 5.8.7 娣卞害瀹氬埗鍒嗘敮锛夋彁浜ょ殑瀹屾暣绉佹湁 media3 AAR 濂椾欢
  # 锛堜笂娓?.gitignore 鎺掗櫎 lib-*.aar锛屽畼鏂规湭鍏紑鍙戝竷锛屾澶勫彇鑷ぞ鍖哄悓婧愬垎鏀級
  AAR_REPO: 'ctowl2018/NewTV2'
  AAR_SHA: '65ab925802af3e4e5de29d8d6a2f2bdfa91591fa'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python 3.10 (ChaquoPy 鏋勫缓闇€瑕?
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Download FongMi/TV source (5.8.7 pinned)
        run: |
          curl -sSL "https://codeload.github.com/FongMi/TV/zip/${UPSTREAM_SHA}" -o fongmi.zip
          unzip -q fongmi.zip -d fongmi-src
          srcdir="$(find fongmi-src -mindepth 1 -maxdepth 1 -type d | head -1)"
          echo "srcdir=$srcdir" >> "$GITHUB_ENV"

      - name: Download private media3 AAR set
        run: |
          # 涓婃父 app/build.gradle 閫氳繃 fileTree(libs/*.aar) 寮曞叆绉佹湁 media3 缂栬瘧浜х墿
          # 锛坙ib-*.aar 琚?.gitignore 鎺掗櫎锛夛紝浠庡悓婧愮ぞ鍖哄垎鏀浐瀹氭彁浜ょ洿杩?raw 涓嬭浇琛ラ綈
          base="https://raw.githubusercontent.com/${AAR_REPO}/${AAR_SHA}/app/libs"
          mkdir -p "$srcdir/app/libs"
          count=0
          for name in \
            hiddenapibypass.aar \
            lib-common-release.aar \
            lib-container-release.aar \
            lib-database-release.aar \
            lib-datasource-okhttp-release.aar \
            lib-datasource-release.aar \
            lib-datasource-rtmp-release.aar \
            lib-decoder-ffmpeg-release.aar \
            lib-decoder-mpegh-release.aar \
            lib-decoder-release.aar \
            lib-effect-release.aar \
            lib-exoplayer-dash-release.aar \
            lib-exoplayer-hls-release.aar \
            lib-exoplayer-release.aar \
            lib-exoplayer-rtsp-release.aar \
            lib-exoplayer-smoothstreaming-release.aar \
            lib-extractor-release.aar \
            lib-mpvplayer-release.aar \
            lib-session-release.aar \
            lib-ui-danmaku-release.aar \
            lib-ui-release.aar ; do
            curl -fsSL --retry 3 "$base/$name" -o "$srcdir/app/libs/$name"
            [ -s "$srcdir/app/libs/$name" ] || { echo "涓嬭浇澶辫触: $name"; exit 1; }
            count=$((count + 1))
          done
          ls -la "$srcdir/app/libs"
          echo "涓嬭浇 AAR 鏁伴噺: $count"
          [ "$count" -ge 20 ] || { echo "AAR 涓嬭浇鏁伴噺寮傚父"; exit 1; }

      - name: Apply personal patches (鍐呯疆婧?+ 绛惧悕 + 搴旂敤鍚?
        run: node tvbox/patch-fongmi.mjs "$srcdir" --repo-root "$GITHUB_WORKSPACE"

      - name: Build mobile & leanback release
        run: |
          cd "$srcdir"
          chmod +x gradlew
          ./gradlew :app:assembleMobileRelease :app:assembleLeanbackRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p tvbox-dist
          find "$srcdir/app/build/outputs/apk" -name '*.apk' -path '*release*' | while read -r f; do
            base="$(basename "$f")"
            case "$f" in
              *mobile*) flavor="mobile" ;;
              *leanback*) flavor="tv" ;;
              *) flavor="unknown" ;;
            esac
            case "$base" in
              *arm64*) abi="arm64" ;;
              *v7a*) abi="v7a" ;;
              *) abi="universal" ;;
            esac
            cp "$f" "tvbox-dist/XCTV-${flavor}-${abi}.apk"
          done
          ls -la tvbox-dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVBox-apk
          path: tvbox-dist/*
          if-no-files-found: error

