name: Daily Source Check

on:
  schedule:
    # 每天 UTC 00:30（北京时间 08:30）自动运行
    - cron: "30 0 * * *"
  workflow_dispatch: # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run checker (full mode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 提升上游拉取的 API 限额
        run: node sources/checker.mjs --full --timeout 12000

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: 每日采集源检测 $(date -u +%F) （$(node -p "require('./output/checked_sources.json').summary.ok") 个可用）"
            git push
          fi
